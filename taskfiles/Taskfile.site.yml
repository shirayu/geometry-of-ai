---
version: '3'

tasks:
  dev:
    desc: Start dev server
    vars:
      HOST: '{{.HOST | default ""}}'
      PORT: '{{.PORT | default ""}}'
    cmds:
      - |
        args=""
        {{ if .HOST }}args="$args --host {{.HOST}}"{{ end }}
        {{ if .PORT }}args="$args --port {{.PORT}}"{{ end }}
        pnpm --filter geometry-of-ai-site dev $args

  build:
    desc: Build site
    cmds:
      - pnpm --filter geometry-of-ai-site build

  preview:
    desc: Preview built site
    vars:
      HOST: '{{.HOST | default ""}}'
      PORT: '{{.PORT | default ""}}'
    cmds:
      - |
        args=""
        {{ if .HOST }}args="$args --host {{.HOST}}"{{ end }}
        {{ if .PORT }}args="$args --port {{.PORT}}"{{ end }}
        pnpm --filter geometry-of-ai-site preview $args
