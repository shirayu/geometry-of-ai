---
version: '3'

vars:
  SERIES_DIR: site/series

tasks:
  all:
    desc: Run all linters in parallel
    deps:
      - math
      - quiz
      - body_anchors
      - math_rules
      - insertion
      - fence
      - snippet_lines
      - section_order
      - py
      - md
      - image
      - keyword_duplicates
      - greek
      - ruff
      - ruff_check
      - typos
      - snippets
      - terms
      - references
      - citations
      - svg_naming
      - lecture_links
      - toc_coverage
      - bold_emphasis

  math:
    desc: Check math expressions
    cmds:
      - node ./scripts/check-math.mjs {{.SERIES_DIR}}

  quiz:
    desc: Check quiz format, MathJax rendering, and body references
    cmds:
      - node ./site/scripts/check_quiz.mjs
      - node ./site/scripts/check_quiz_quality.mjs

  body_anchors:
    desc: Check body files' in-page anchor links resolve to headings/HTML anchors
    cmds:
      - node --test ./site/scripts/check_body_anchors.test.mjs
      - node ./site/scripts/check_body_anchors.mjs

  math_rules:
    desc: Check markdown math rules
    cmds:
      - python3 ./scripts/check_markdown_math_rules.py {{.SERIES_DIR}}

  insertion:
    desc: Check inline math spacing
    cmds:
      - python3 ./scripts/check_inline_math_spacing.py {{.SERIES_DIR}}

  fence:
    desc: Check no plain python fences
    cmds:
      - python3 ./scripts/lint_no_plain_python_fence.py {{.SERIES_DIR}}

  snippet_lines:
    desc: Check snippet line counts
    cmds:
      - python3 ./scripts/check_snippet.py snippets --markdown-dir {{.SERIES_DIR}}

  section_order:
    desc: Check section structure
    cmds:
      - python3 ./scripts/check_structure.py {{.SERIES_DIR}}

  py:
    desc: Compile-check Python scripts
    cmds:
      - python3 -m compileall -q scripts

  md:
    desc: Lint markdown files
    cmds:
      - pnpm exec markdownlint-cli2

  image:
    desc: Check image links
    cmds:
      - python3 ./scripts/check_image_links.py {{.SERIES_DIR}}

  keyword_duplicates:
    desc: Check keyword duplicates
    cmds:
      - python3 ./scripts/check_keyword_duplicates.py {{.SERIES_DIR}}/keywords.md

  greek:
    desc: Check Greek letters outside Python blocks
    cmds:
      - python3 ./scripts/check_greek_outside_python.py {{.SERIES_DIR}}

  ruff:
    desc: Lint Python with ruff
    cmds:
      - uv run ruff check --respect-gitignore

  ruff_check:
    desc: Check Python formatting with ruff
    cmds:
      - uv run ruff format --respect-gitignore --check

  typos:
    desc: Check typos
    cmds:
      - typos

  terms:
    desc: Check terminology and notation rules
    cmds:
      - uv run python ./scripts/check_terms.py {{.SERIES_DIR}}

  references:
    desc: Check 参考文献 sections are in sync with references.bib + refs/*.yml
    cmds:
      - uv run python ./scripts/sync_references.py check

  citations:
    desc: Check body citations （著者, 年） against chapter reference lists
    cmds:
      - uv run python ./scripts/check_citations.py {{.SERIES_DIR}}

  snippets:
    desc: Check snippets are in sync with markdown
    cmds:
      - |
        tmpdir=$(mktemp -d)
        python3 ./scripts/sync_snippets.py --snippets-dir "$tmpdir" extract {{.SERIES_DIR}}
        diff -qr "$tmpdir" snippets

  svg_naming:
    desc: Check SVG file naming convention (NN_name.svg, no fig_ prefix)
    cmds:
      - python3 ./scripts/check_svg_naming.py {{.SERIES_DIR}}

  lecture_links:
    desc: Check that 第N回/Appendix N references are Markdown links
    cmds:
      - python3 ./scripts/check_lecture_links.py {{.SERIES_DIR}}

  toc_coverage:
    desc: Check that all series pages are registered in toc.data.ts
    cmds:
      - python3 ./scripts/check_toc_coverage.py {{.SERIES_DIR}}

  bold_emphasis:
    desc: Check that ** / __ emphasis actually renders (CommonMark flanking rules)
    cmds:
      - node ./scripts/check_bold_emphasis.mjs {{.SERIES_DIR}}
