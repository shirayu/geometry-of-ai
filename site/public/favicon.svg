<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a1a"/>
  <!-- Stars -->
  <circle cx="6" cy="5" r="0.8" fill="white" opacity="0.9"/>
  <circle cx="14" cy="3" r="0.5" fill="white" opacity="0.7"/>
  <circle cx="25" cy="6" r="0.7" fill="white" opacity="0.85"/>
  <circle cx="29" cy="3" r="0.5" fill="white" opacity="0.6"/>
  <circle cx="3" cy="12" r="0.5" fill="white" opacity="0.7"/>
  <circle cx="28" cy="14" r="0.6" fill="white" opacity="0.8"/>
  <circle cx="20" cy="2" r="0.4" fill="white" opacity="0.6"/>
  <circle cx="9" cy="9" r="0.4" fill="white" opacity="0.5"/>
  <!-- Geodesic triangle on sphere (manifold shape) -->
  <circle cx="16" cy="18" r="10" fill="none" stroke="#3a6bcc" stroke-width="1" opacity="0.5"/>
  <!-- Great circle arcs approximated as ellipse arcs -->
  <ellipse cx="16" cy="18" rx="10" ry="4" fill="none" stroke="#4a7be0" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="16" cy="18" rx="4" ry="10" fill="none" stroke="#4a7be0" stroke-width="0.8" opacity="0.5"/>
  <!-- Bright nodes at intersections -->
  <circle cx="16" cy="8" r="1.2" fill="#a0c4ff"/>
  <circle cx="7.3" cy="21.5" r="1.2" fill="#a0c4ff"/>
  <circle cx="24.7" cy="21.5" r="1.2" fill="#a0c4ff"/>
  <!-- Connecting geodesic lines -->
  <path d="M16 8 Q10 14 7.3 21.5" fill="none" stroke="#c0d8ff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16 8 Q22 14 24.7 21.5" fill="none" stroke="#c0d8ff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M7.3 21.5 Q16 24 24.7 21.5" fill="none" stroke="#c0d8ff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
