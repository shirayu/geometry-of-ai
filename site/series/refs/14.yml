  - key: edelsbrunner2010
    note:
    - 計算トポロジーの標準的教科書。パーシステントホモロジーの理論的基盤を厳密に扱う。
  - key: carlsson2009
    note:
    - TDAの創始者による解説論文。データ解析へのトポロジー応用の動機と基本概念を説明。
