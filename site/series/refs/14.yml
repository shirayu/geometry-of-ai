    note:
    - ニューラルネットワークの決定境界のトポロジーを研究。ReLUネットワークとskip connectionの効果を議論。
  - key: gabrielsson2019
    note:
    - ニューラルネットワークの活性化空間のトポロジー解析手法を提案。
