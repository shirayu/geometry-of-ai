categories:
- title: 分布埋め込みとvMF分布
  entries:
  - key: kingma2014
    note:
    - VAEの原論文。潜在空間をガウス分布として正則化する枠組みを提案。本回では、ガウス空間の不均一性と球面表現への動機付けの文脈で参照。
  - key: nagata2023
    note:
    - 本回の中心的な参考文献。埋め込みの分散が意味の違いを検出する上で重要であることを示した。
  - key: nagata2025
    note:
    - Zipfの意味-頻度則を文脈的多様性（Contextual Diversity）の観点から再定式化。頻出語が埋め込み空間で広い分散を持つ理論的根拠を提供。本回では、vMF分布における低 $\kappa$ （広がり）の言語学的正当性を説明するコラムで言及。
  - key: mardia2000
    note:
    - 方向統計学の標準的教科書。vMF分布を含む球面上の分布理論を体系的に扱う。
  - key: davidson2018
    note:
    - VAEの潜在空間にvMF分布を導入。球面上のサンプリングとreparameterization trickを扱う。
  - key: diethe2015
    note:
    - vMF分布間のKLダイバージェンスの厳密な導出。数値安定な計算方法についても議論。本回の実装ノートで近似を使う際の参照先。
- title: 不確実性の定量化
  entries:
  - key: gal2016
    note:
    - Dropoutによる不確実性推定の古典的論文。分布埋め込みとは異なるアプローチだが、不確実性の重要性を示した。
  - key: sensoy2018
    note:
    - 証拠理論に基づく不確実性の定量化。OOD検知への応用を扱う。
- title: OOD検知
  entries:
  - key: hendrycks2017
    note:
    - OOD検知のベースライン手法。Softmax確率を使った単純だが効果的な方法を提案。
  - key: lee2018ood
    note:
    - Mahalanobis距離に基づくOOD検知。特徴空間の幾何学を活用。
- title: ハルシネーションと信頼性
  entries:
  - key: ji2023
    note:
    - ハルシネーションの包括的サーベイ。原因、検出、緩和策を整理。
    - '本回の不確実性推定（低 $\kappa$ の検出）では対処できない、「高 $\kappa$ だが誤った方向」を指すハルシネーションについては、[Appendix 2: 多様体の純度問題](appendix.2.md)で扱う。幾何学が「データの真偽」に対して原理的に中立である理由と、外部検証が必要となる構造を説明している。'
- title: 球面上のサンプリング
  entries:
  - key: wood1994
    note:
    - vMF分布からの効率的なサンプリングアルゴリズム。実装ノートで使用した方法の原典。
