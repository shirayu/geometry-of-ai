# Files for typos
# Instruction:  https://github.com/marketplace/actions/typos-action#getting-started

[default.extend-identifiers]
noInferrableTypes = "noInferrableTypes"

[default.extend-words]
NCE="NCE"
Teh="Teh"
fpr="fpr"
IIT="IIT"
Ba="Ba"
arange="arange"
nd="nd"

[files]
extend-exclude = ['package*.json', '*.min.js']
